    <path d="M232 170c10-6 26-4 34 6 6 8 4 22 10 32 8 14 2 34-10 44-8 7-12 20-22 22-8 1-10-12-12-22-2-12-10-20-12-32-2-12 2-24 8-32 2-6 0-14 4-18z"/>
    <path d="M222 120c14-8 40-10 54-2 10 6 4 18-6 20-12 2-22 8-34 6-10-2-24-16-14-24z"/>
    <path d="M300 112c18-6 44 0 56 14 8 10 0 22-12 22-14 0-24 10-38 6-12-4-18-16-14-26 2-8 2-14 8-16z"/>
    <path d="M120 140c14-12 40-14 52-2 8 8 2 20-8 26-8 6-10 18-20 22-12 4-22-6-26-18-4-10-6-20 2-28z"/>
    <path d="M150 230c10-4 22 2 24 14 2 14-6 30-14 40-6 6-14 2-16-6-4-14-6-30-2-42 2-4 4-6 8-6z"/>
