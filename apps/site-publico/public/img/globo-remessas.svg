<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t">
  <title id="t">Remessas de Luanda para o mundo</title>
  <defs>
    <radialGradient id="g-esfera" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#2a63b0"/>
      <stop offset="0.55" stop-color="#0c3f82"/>
      <stop offset="1" stop-color="#031d42"/>
    </radialGradient>
    <radialGradient id="g-brilho" cx="35%" cy="25%" r="40%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-arco" x1="0" x2="1">
