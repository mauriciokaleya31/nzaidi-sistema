  <circle cx="240" cy="200" r="150" fill="url(#g-brilho)"/>
  <circle cx="240" cy="200" r="150" fill="none" stroke="#CC9638" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Arcos de remessa a partir de Luanda -->
  <g fill="none" stroke="url(#g-arco)" stroke-width="2.5" stroke-linecap="round">
    <path class="arco" d="M246 232 C 260 120, 330 90, 330 128"/>
    <path class="arco" d="M246 232 C 220 110, 160 110, 150 150"/>
    <path class="arco" d="M246 232 C 300 160, 380 200, 372 250"/>
