    <circle cx="372" cy="250" r="5"/>
    <circle cx="118" cy="240" r="5"/>
  </g>
  <!-- Luanda -->
  <circle cx="246" cy="232" r="14" fill="#CC9638" fill-opacity="0.25"/>
  <circle cx="246" cy="232" r="7" fill="#fff" stroke="#CC9638" stroke-width="3"/>
  <g font-family="Montserrat, Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#fff">
