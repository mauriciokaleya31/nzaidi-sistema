    <ellipse cx="240" cy="200" rx="150" ry="130"/>
    <ellipse cx="240" cy="200" rx="40" ry="150"/>
    <ellipse cx="240" cy="200" rx="90" ry="150"/>
    <ellipse cx="240" cy="200" rx="130" ry="150"/>
    <line x1="90" y1="200" x2="390" y2="200"/>
    <line x1="240" y1="50" x2="240" y2="350"/>
