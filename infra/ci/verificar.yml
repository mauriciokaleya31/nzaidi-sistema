name: Verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Tipos (TypeScript estrito)
        run: npm run verificar:tipos
      - name: Testes
        run: npm run testes
      - name: Documentação e segredos
        run: python scripts/verificar-documentacao.py
