openapi: 3.1.0
info:
  title: NZAIDI Mobile API
  version: 1.1.0
  description: >
    API REST oficial da NZAIDI – Casa de Câmbios & Transferência, Lda.
    Desenvolvida para integração da aplicação móvel oficial (Android e iOS).
    Supervisionada pelo Banco Nacional de Angola (BNA).
servers:
  - url: https://homolog-api.nzaidi.ao/api/v1/mobile
    description: Servidor de Homologação / Testes (Ambiente Seguro)
  - url: http://127.0.0.1:3000/api/v1/mobile
    description: Desenvolvimento Local (Desktop / Testes Locais)
  
  - url: https://app.nzaidi.ao/api/v1/mobile
    description: Servidor de Produção Oficial (Luanda)

paths:
  /auth/login:
    post:
      summary: Login de Cliente e Registo de Dispositivo
      description: >
        Autentica o cliente via e-mail e palavra-passe, regista o telemóvel na base de dados,
        valida bloqueios institucionais de segurança e emite o par Access Token JWT e Refresh Token rotativo.
      operationId: mobileLogin
      parameters:
        - $ref: '#/components/parameters/HeaderDeviceId'
        - $ref: '#/components/parameters/HeaderPlatform'
        - $ref: '#/components/parameters/HeaderAppVersion'
        - $ref: '#/components/parameters/HeaderOsVersion'
        - $ref: '#/components/parameters/HeaderDeviceName'
        - $ref: '#/components/parameters/HeaderPushToken'
        - $ref: '#/components/parameters/HeaderCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginInput'
      responses:
        '200':
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAuthResponse'
        '401':
          description: Credenciais inválidas ou conta suspensa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadrao'
        '429':
          description: Limite de tentativas excedido (Rate limit)

  /auth/refresh:
    post:
      summary: Renovação Atómica de Sessão (Refresh Token Rotativo)
      description: >
        Invalida imediatamente o refresh token fornecido (prevenindo reúso e roubo de sessão)
        e emite um novo par de tokens.
      operationId: mobileRefreshToken
      parameters:
        - $ref: '#/components/parameters/HeaderDeviceId'
        - $ref: '#/components/parameters/HeaderPlatform'
        - $ref: '#/components/parameters/HeaderAppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRefreshInput'
      responses:
        '200':
          description: Sessão renovada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRefreshResponse'
        '401':
          description: Refresh token expirado, inválido ou já revogado

  /auth/logout:
    post:
      summary: Terminar Sessão no Dispositivo Atual
      description: Revoga a sessão móvel activa no dispositivo actual.
      operationId: mobileLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão terminada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSucesso'

  /auth/logout-global:
    post:
      summary: Terminar Todas as Sessões Móveis
      description: Encerra todas as sessões em todos os dispositivos do cliente simultaneamente.
      operationId: mobileLogoutGlobal
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Todas as sessões revogadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaSucesso'

  /auth/recuperar-senha:
    post:
      summary: Solicitar Código OTP para Recuperação de Palavra-Passe
      description: Gera e envia um código numérico de 6 dígitos para o e-mail cadastrado.
      operationId: mobileRecuperarSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: cliente.exemplo@nzaidi.ao
      responses:
        '200':
          description: Código OTP gerado e despachado

  /auth/redefinir-senha:
    post:
      summary: Redefinir Palavra-Passe com OTP
      description: Valida o código OTP e actualiza a palavra-passe do cliente.
      operationId: mobileRedefinirSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, codigoOtp, novaSenha]
              properties:
                email:
                  type: string
                  format: email
                codigoOtp:
                  type: string
                  example: "123456"
                novaSenha:
                  type: string
                  minLength: 8
                  example: "NovaSenhaForte@2026"
      responses:
        '200':
          description: Palavra-passe redefinida com sucesso

  /auth/dispositivos:
    get:
      summary: Listar Dispositivos Autorizados do Cliente
      description: Devolve a lista de telemóveis Android e iOS associados à conta do cliente.
      operationId: mobileListarDispositivos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de dispositivos recuperada

  /auth/dispositivos/{id}:
    delete:
      summary: Revogar Acesso de um Dispositivo
      description: Bloqueia e revoga o acesso de um telemóvel específico do cliente.
      operationId: mobileRevogarDispositivo
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dispositivo revogado com sucesso

  /dispositivos/push-token:
    post:
      summary: Atualizar Token Push (FCM / APNs)
      description: Permite ao aplicativo móvel registar ou renovar o token de notificações push.
      operationId: mobileAtualizarPushToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
                  example: "fcm_token_ou_apns_device_token_aqui"
      responses:
        '200':
          description: Token push actualizado com sucesso

  /cliente/perfil:
    get:
      summary: Consultar Perfil Cadastral e Estatísticas
      operationId: mobileConsultarPerfil
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados cadastrais completos
    put:
      summary: Actualizar Dados Pessoais Permitidos
      operationId: mobileAtualizarPerfil
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAtualizarPerfilInput'
      responses:
        '200':
          description: Perfil actualizado com sucesso

  /cliente/kyc/status:
    get:
      summary: Consultar Estado de Verificação KYC e Limites
      operationId: mobileConsultarKycStatus
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Nível KYC, limites diários/anuais e estado da conta

  /cliente/documentos:
    get:
      summary: Listar Documentos KYC Submetidos
      operationId: mobileListarDocumentos
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Histórico de documentos e parecer de validação
    post:
      summary: Carregar Documento de Identificação Oficial
      description: >
        Suporta envio via JSON com arquivoBase64 ou Multipart.
        Formatos aceites: PDF, PNG, JPEG. Limite estrito de 5 MB com validação de magic bytes.
      operationId: mobileCarregarDocumento
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarregarDocumentoInput'
      responses:
        '201':
          description: Documento submetido para validação de conformidade

  /dashboard:
    get:
      summary: Dashboard Inicial Consolidado
      description: Informação agregada para a página principal da app (taxas, estado KYC, atalhos, anúncios).
      operationId: mobileObterDashboard
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dados consolidados do dashboard

  /taxas:
    get:
      summary: Consultar Taxas de Câmbio Oficiais em Tempo Real
      description: Taxas de compra, venda e referência do BNA para USD e EUR com moeda base AOA.
      operationId: mobileObterTaxas
      responses:
        '200':
          description: Cotações oficiais e carimbo de actualização

  /cambio/moedas:
    get:
      summary: Moedas Disponíveis para Operação
      operationId: mobileListarMoedas
      responses:
        '200':
          description: Lista de moedas autorizadas (USD, EUR, AOA)

  /cambio/simular:
    post:
      summary: Simulação Instantânea de Câmbio
      description: Calcula o contravalor e limites sem gravar na base de dados.
      operationId: mobileSimularCambio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimularCambioInput'
      responses:
        '200':
          description: Cálculo de simulação com taxa garantida

  /cambio/pedidos:
    get:
      summary: Listar Pedidos de Câmbio do Cliente
      operationId: mobileListarPedidosCambio
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Histórico de pedidos cambiais
    post:
      summary: Registar Pedido de Câmbio
      operationId: mobileCriarPedidoCambio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoCambioInput'
      responses:
        '201':
          description: Pedido de câmbio registado com sucesso

  /remessas/paises:
    get:
      summary: Listar Países e Corredores de Remessas
      operationId: mobileListarPaisesRemessas
      responses:
        '200':
          description: Países habilitados e respetivas moedas de entrega

  /remessas/pedidos:
    get:
      summary: Listar Pedidos de Remessa Internacional
      operationId: mobileListarPedidosRemessa
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Histórico de transferências para o exterior
    post:
      summary: Registar Pedido de Remessa Internacional
      operationId: mobileCriarPedidoRemessa
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoRemessaInput'
      responses:
        '201':
          description: Pedido de remessa registado com sucesso

  /cartoes:
    get:
      summary: Consultar Cartões Visa e Estado da Fila
      operationId: mobileConsultarCartoes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado do serviço de cartões virtuais

  /cartoes/status:
    get:
      summary: Estado Geral do Serviço de Cartões Visa
      operationId: mobileConsultarStatusCartoes
      responses:
        '200':
          description: Informação sobre preparação do serviço StroWallet

  /cartoes/lista-espera:
    post:
      summary: Aderir à Lista de Espera de Cartões Visa
      operationId: mobileAderirListaEsperaCartoes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Adesão confirmada

  /notificacoes:
    get:
      summary: Listar Notificações do Cliente
      operationId: mobileListarNotificacoes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de alertas, avisos e comunicações com contador de não lidas

  /notificacoes/{id}/lida:
    patch:
      summary: Marcar Notificação como Lida
      operationId: mobileMarcarNotificacaoLida
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notificação actualizada

  /notificacoes/ler-todas:
    post:
      summary: Marcar Todas as Notificações como Lidas
      operationId: mobileMarcarTodasNotificacoesLidas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Todas as notificações marcadas como lidas

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    HeaderDeviceId:
      name: x-device-id
      in: header
      required: true
      description: Identificador único e persistente do telemóvel (ex: android_id ou identifierForVendor).
      schema:
        type: string
        example: "d41d8cd98f00b204e9800998ecf8427e"

    HeaderPlatform:
      name: x-platform
      in: header
      required: true
      description: Plataforma do sistema operativo em minúsculas (android ou ios).
      schema:
        type: string
        enum: [android, ios]
        example: "android"

    HeaderAppVersion:
      name: x-app-version
      in: header
      required: true
      description: Versão semântica da aplicação instalada.
      schema:
        type: string
        example: "1.0.0"

    HeaderOsVersion:
      name: x-os-version
      in: header
      required: false
      description: Versão do sistema operativo do telemóvel.
      schema:
        type: string
        example: "14.0"

    HeaderDeviceName:
      name: x-device-name
      in: header
      required: false
      description: Modelo legível do dispositivo.
      schema:
        type: string
        example: "Samsung Galaxy S24"

    HeaderPushToken:
      name: x-push-token
      in: header
      required: false
      description: Token FCM (Firebase) ou APNs (Apple) para envio de push notifications.
      schema:
        type: string
        example: "eK3x9z_ABC123..."

    HeaderCorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: UUID gerado pelo app móvel para rastreamento de ponta a ponta.
      schema:
        type: string
        format: uuid
        example: "7b4e09cb-1b2c-4e8f-9a1d-2f0e4b8a1c9e"

  schemas:
    RespostaSucesso:
      type: object
      properties:
        sucesso:
          type: boolean
          example: true
        mensagem:
          type: string
          example: "Operação executada com sucesso."

    ErroPadrao:
      type: object
      properties:
        sucesso:
          type: boolean
          example: false
        erro:
          type: string
          example: "Credenciais inválidas. Verifique o seu e-mail e palavra-passe."
        codigo:
          type: string
          example: "AUTH_CREDENCIAIS_INVALIDAS"

    MobileLoginInput:
      type: object
      required:
        - email
        - senha
        - deviceId
        - plataforma
        - nomeDispositivo
      properties:
        email:
          type: string
          format: email
          example: "cliente@exemplo.ao"
        senha:
          type: string
          format: password
          example: "PalavraPasseSegura@2026"
        deviceId:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"
        plataforma:
          type: string
          enum: [android, ios]
          example: "android"
        nomeDispositivo:
          type: string
          example: "Samsung Galaxy S24"
        versaoSo:
          type: string
          example: "14.0"
        versaoApp:
          type: string
          example: "1.0.0"
        tokenPush:
          type: string
          example: "fcm_token_exemplo"

    MobileAuthResponse:
      type: object
      properties:
        sucesso:
          type: boolean
          example: true
        mensagem:
          type: string
          example: "Autenticação móvel efetuada com sucesso."
        dados:
          type: object
          properties:
            accessToken:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            tokenType:
              type: string
              example: "Bearer"
            expiresInSeconds:
              type: integer
              example: 900
            refreshToken:
              type: string
              example: "nzaidi_rt_a1b2c3d4e5f6..."
            cliente:
              type: object
              properties:
                id:
                  type: string
                  example: "cli_10293847"
                nome:
                  type: string
                  example: "Manuel Domingos Ferreira"
                email:
                  type: string
                  example: "cliente@exemplo.ao"
                telefone:
                  type: string
                  example: "+244 923 000 000"
                kycStatus:
                  type: string
                  example: "aprovado"
                nivelKyc:
                  type: integer
                  example: 2
            dispositivo:
              type: object
              properties:
                id:
                  type: string
                  example: "disp_87654321"
                deviceId:
                  type: string
                  example: "d41d8cd98f00b204e9800998ecf8427e"
                plataforma:
                  type: string
                  example: "android"
                status:
                  type: string
                  example: "ativo"

    MobileRefreshInput:
      type: object
      required:
        - refreshToken
        - deviceId
      properties:
        refreshToken:
          type: string
          example: "nzaidi_rt_a1b2c3d4e5f6..."
        deviceId:
          type: string
          example: "d41d8cd98f00b204e9800998ecf8427e"

    MobileRefreshResponse:
      type: object
      properties:
        sucesso:
          type: boolean
          example: true
        mensagem:
          type: string
          example: "Sessão renovada com sucesso."
        dados:
          type: object
          properties:
            accessToken:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            tokenType:
              type: string
              example: "Bearer"
            expiresInSeconds:
              type: integer
              example: 900
            refreshToken:
              type: string
              example: "nzaidi_rt_f6e5d4c3b2a1..."

    MobileAtualizarPerfilInput:
      type: object
      properties:
        telefone:
          type: string
          example: "+244 923 111 222"
        email:
          type: string
          example: "novo.email@exemplo.ao"
        morada:
          type: string
          example: "Rua Rainha Ginga, Edifício NZAIDI, Luanda"
        profissao:
          type: string
          example: "Engenheiro de Software"
        entidadeEmpregadora:
          type: string
          example: "NZAIDI Tecnologias"

    CarregarDocumentoInput:
      type: object
      required:
        - tipoDocumento
        - numeroDocumento
        - nomeArquivo
        - mimeType
        - arquivoBase64
      properties:
        tipoDocumento:
          type: string
          enum: [bi, passaporte, cartao_residente, nif_empresa]
          example: "bi"
        numeroDocumento:
          type: string
          example: "DOC-EXEMPLO-001"
        nomeArquivo:
          type: string
          example: "bilhete_identidade_frente_verso.pdf"
        mimeType:
          type: string
          enum: [application/pdf, image/png, image/jpeg]
          example: "application/pdf"
        arquivoBase64:
          type: string
          description: Ficheiro codificado em Base64 (máximo 5 MB)
          example: "JVBERi0xLjQKJ..."

    SimularCambioInput:
      type: object
      required:
        - tipoOperacao
        - moeda
        - montante
      properties:
        tipoOperacao:
          type: string
          enum: [compra, venda]
          example: "compra"
        moeda:
          type: string
          enum: [USD, EUR]
          example: "USD"
        montante:
          type: string
          example: "500"

    CriarPedidoCambioInput:
      type: object
      required:
        - tipoOperacao
        - moeda
        - montanteDivisa
        - finalidade
      properties:
        tipoOperacao:
          type: string
          enum: [compra, venda]
          example: "compra"
        moeda:
          type: string
          enum: [USD, EUR]
          example: "USD"
        montanteDivisa:
          type: string
          example: "500"
        metodoPagamento:
          type: string
          enum: [MULTICAIXA_EXPRESS, REFERENCIA_MULTICAIXA, TRANSFERENCIA_BANCARIA, BALCAO]
          example: "MULTICAIXA_EXPRESS"
        finalidade:
          type: string
          example: "Viagem de negócios ao exterior"

    CriarPedidoRemessaInput:
      type: object
      required:
        - paisDestino
        - moeda
        - valorEstrangeiro
        - beneficiarioNome
        - beneficiarioIban
        - finalidade
      properties:
        paisDestino:
          type: string
          example: "Portugal"
        moeda:
          type: string
          enum: [EUR, USD]
          example: "EUR"
        valorEstrangeiro:
          type: number
          example: 1000
        beneficiarioNome:
          type: string
          example: "Ana Ferreira"
        beneficiarioIban:
          type: string
          example: "PT50003506512345678901234"
        finalidade:
          type: string
          example: "Apoio familiar mensal"
        metodoPagamento:
          type: string
          enum: [MULTICAIXA_EXPRESS, REFERENCIA_MULTICAIXA, TRANSFERENCIA_BANCARIA, BALCAO]
          example: "MULTICAIXA_EXPRESS"
